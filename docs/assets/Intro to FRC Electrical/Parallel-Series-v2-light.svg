<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Parallel vs series circuit wiring</title>
<desc>A battery on the left connects to two lightbulbs. In the parallel arrangement both bulbs tap independently into shared positive and negative rails. In the series arrangement the bulbs sit one after another along a single loop.</desc>

<defs>
  <g id="battery">
    <rect x="-35" y="-65" width="70" height="130" rx="16" fill="#E6F1FB" stroke="#4272f5" stroke-width="2.5"/>
    <rect x="-14" y="-81" width="28" height="16" rx="6" fill="#E6F1FB" stroke="#4272f5" stroke-width="2.5"/>
  </g>
  <g id="bulb">
    <circle r="36" fill="#EF9F27" opacity="0.16"/>
    <rect x="-10" y="15" width="20" height="14" rx="4" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1.5"/>
    <line x1="-8" y1="19" x2="8" y2="19" stroke="#5F5E5A" stroke-width="1.5"/>
    <line x1="-8" y1="24" x2="8" y2="24" stroke="#5F5E5A" stroke-width="1.5"/>
    <circle r="24" fill="#FAC775" stroke="#4272f5" stroke-width="2.5"/>
    <path d="M -8 6 L -3 -4 L 3 6 L 8 -4" fill="none" stroke="#4272f5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
</defs>

<path d="M 91.5 54.6 Q 100.0 30.0 126.0 30.0 L 834.0 30.0 Q 860.0 30.0 868.5 54.6 L 931.5 235.4 Q 940.0 260.0 931.5 284.6 L 868.5 465.4 Q 860.0 490.0 834.0 490.0 L 126.0 490.0 Q 100.0 490.0 91.5 465.4 L 28.5 284.6 Q 20.0 260.0 28.5 235.4 L 91.5 54.6 Z" fill="none" stroke="#4272f5" stroke-width="3"/>

<line x1="480" y1="110" x2="480" y2="410" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="5 6"/>

<text x="280" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#4272f5">Parallel</text>
<text x="680" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#4272f5">Series</text>

<path d="M185,199 L185,156 Q185,140 201,140 L394,140 Q410,140 410,156 L410,256" fill="none" stroke="#d64545" stroke-width="3" stroke-linecap="round"/>
<path d="M320,140 L320,256" fill="none" stroke="#d64545" stroke-width="3" stroke-linecap="round"/>
<path d="M185,361 L185,404 Q185,420 201,420 L394,420 Q410,420 410,404 L410,309" fill="none" stroke="#2b2b2e" stroke-width="3" stroke-linecap="round"/>
<path d="M320,309 L320,420" fill="none" stroke="#2b2b2e" stroke-width="3" stroke-linecap="round"/>

<use href="#battery" x="185" y="280"/>
<use href="#bulb" x="320" y="280"/>
<use href="#bulb" x="410" y="280"/>

<path d="M560,199 L560,156 Q560,140 576,140 L656,140" fill="none" stroke="#d64545" stroke-width="3" stroke-linecap="round"/>
<path d="M704,140 L766,140" fill="none" stroke="#d64545" stroke-width="3" stroke-linecap="round"/>
<path d="M814,140 Q830,140 830,156 L830,404 Q830,420 814,420 L576,420 Q560,420 560,404 L560,361" fill="none" stroke="#2b2b2e" stroke-width="3" stroke-linecap="round"/>

<use href="#battery" x="560" y="280"/>
<use href="#bulb" x="680" y="140"/>
<use href="#bulb" x="790" y="140"/>

</svg>
