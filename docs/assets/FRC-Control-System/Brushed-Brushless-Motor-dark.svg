<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Brushed vs brushless motor construction</title>
<desc>Left: a brushed motor. A battery feeds two wires into a pair of brushes that press against a rotating split commutator below a red north / blue south magnet ring. The commutator switches current through the coil-wound rotor as it spins inside the ring. Right: a brushless motor. A battery feeds two wires into a fixed terminal block, which distributes current internally to three fixed coils arranged around a small red north / blue south magnet rotor. The rotor spins freely with no brush contact.</desc>

<defs>
  <g id="battery">
    <rect x="-35" y="-65" width="70" height="130" rx="16" fill="#0c447c" stroke="#7c9dfa" stroke-width="2.5"/>
    <rect x="-14" y="-81" width="28" height="16" rx="6" fill="#0c447c" stroke="#7c9dfa" stroke-width="2.5"/>
  </g>
</defs>

<rect x="24" y="24" width="912" height="472" rx="28" ry="28" fill="none" stroke="#7c9dfa" stroke-width="3"/>
<line x1="480" y1="110" x2="480" y2="430" stroke="#4a4a50" stroke-width="1.5" stroke-dasharray="5 6"/>

<text x="265" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#7c9dfa">Brushed</text>
<text x="730" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#7c9dfa">Brushless</text>

